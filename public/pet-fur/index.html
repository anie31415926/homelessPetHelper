<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f8fbf6">
    <title>豆豆 · 摸毛试做</title>
    <link rel="stylesheet" href="./style.css">
    <script defer src="./fur.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>豆豆</h1>
        <span>摸毛试做</span>
      </header>
      <section class="scene" aria-label="豆豆的近景">
        <canvas width="400" height="470" tabindex="0" role="button" aria-label="摸摸豆豆" aria-keyshortcuts="Enter Space"></canvas>
        <p role="alert" hidden>没能打开豆豆的图片。</p>
      </section>
      <footer>
        <div class="compare" role="group" aria-label="毛发对照">
          <button type="button" data-mode="still" aria-pressed="false">固定毛发</button>
          <button type="button" data-mode="live" aria-pressed="true">动态毛发</button>
        </div>
      </footer>
    </main>
  </body>
</html>
